name: vRAM device
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Workload (S for two-class pages, F for tiled factors, U for pseudorandom, M for mixed)
        default: F
        type: choice
        options: [S, F, U, M, R, D, W]
      ceiling:
        description: Logical ceiling in MiB
        default: '256'
        type: string
      budget:
        description: Native runner RSS budget in MiB
        default: '192'
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PRISM_CODE_TIER: offline
      PRISM_LEXLEAN_FETCH: '0'
      PRISM_TELEMETRY: '0'
      PROFILE: ${{ inputs.profile || 'F' }}
      CEILING: ${{ inputs.ceiling || '8' }}
      BUDGET: ${{ inputs.budget || '96' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install locked build tools
        run: |
          npm ci --prefix automation --ignore-scripts
          rustup toolchain install 1.97.1 --profile minimal
          echo RUSTUP_TOOLCHAIN=1.97.1 >> "$GITHUB_ENV"
      - name: Check and build the Prism model
        run: |
          python3 automation/facet_queries.py
          automation/node_modules/.bin/prism-code check .
          automation/node_modules/.bin/prism-code build .
          git diff --exit-code -- CONFORMANCE.md
      - name: Check the shared runtime and build the Linux host server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfuse3-dev fuse3
          (cd device && cargo test --locked --offline)
          make -C host LDFLAGS=-static
          cc -Wall -Wextra -O2 -Idevice/native device/validation/churn.c \
            device/target/release/libverdant_memory.a -lpthread -ldl -lm -o "$RUNNER_TEMP/vram-churn"
          "$RUNNER_TEMP/vram-churn"
          cc -Wall -Wextra -Werror -O2 -Idevice/native device/validation/file_admission.c \
            device/target/release/libverdant_memory.a -lpthread -ldl -lm -o "$RUNNER_TEMP/vram-file-admission"
          "$RUNNER_TEMP/vram-file-admission"
          cc -Wall -Wextra -Werror -O2 -Idevice/native device/validation/sparse_extent.c \
            device/target/release/libverdant_memory.a -lpthread -ldl -lm -o "$RUNNER_TEMP/vram-sparse-extent"
          "$RUNNER_TEMP/vram-sparse-extent" 1024
          "$RUNNER_TEMP/vram-sparse-extent" 1024 file
          cc -Wall -Wextra -Werror -O2 -Idevice/native host/tests/nbd_framing.c \
            device/target/release/libverdant_memory.a -lpthread -ldl -lm -o "$RUNNER_TEMP/nbd-framing"
          "$RUNNER_TEMP/nbd-framing"
          python3 host/tests/capacity.py
      - name: Boot Linux and verify Verdant swap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios graphviz
          kernel=linux-image-6.12.117+deb13-amd64_6.12.117-1_amd64.deb
          curl --retry 3 -fsSL "https://deb.debian.org/debian/pool/main/l/linux-signed-amd64/$kernel" -o "$RUNNER_TEMP/linux.deb" ||
            curl --retry 3 -fsSL 'https://snapshot.debian.org/file/8d84a75c14dcaabe4a09e361972d5303721084aa' -o "$RUNNER_TEMP/linux.deb"
          echo "ca712d36790184f6ac125ce2b20ea4e2202ae6bb7817b7de268f1f0115ccda73  $RUNNER_TEMP/linux.deb" | sha256sum -c
          dpkg-deb -x "$RUNNER_TEMP/linux.deb" "$RUNNER_TEMP/linux"
          mkdir -p measurements/local
          python3 host/tests/boot.py --qemu "$(command -v qemu-system-x86_64)" \
            --kernel "$RUNNER_TEMP"/linux/boot/vmlinuz-* \
            --nbd "$RUNNER_TEMP"/linux/usr/lib/modules/*/kernel/drivers/block/nbd.ko.xz \
            --result measurements/local/linux-host.json
          for profile in R D U W; do
            size=32
            if [ "$profile" = W ]; then size=256; fi
            python3 host/tests/boot.py --qemu "$(command -v qemu-system-x86_64)" \
              --kernel "$RUNNER_TEMP"/linux/boot/vmlinuz-* \
              --nbd "$RUNNER_TEMP"/linux/usr/lib/modules/*/kernel/drivers/block/nbd.ko.xz \
              --managed --mib "$size" --profile "$profile" --result "measurements/local/managed-$profile.json"
          done
      - name: Check out the single-page swap control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 45e26a7c19efa3dbf070454a36664295d24b2924
          path: measurements/local/swap-control
      - name: Compare single-page swap latency with zram zstd
        run: |
          make -C measurements/local/swap-control/host build/vram-host LDFLAGS=-static
          accel=tcg
          if [ -c /dev/kvm ]; then accel=kvm; fi
          sudo python3 host/tests/swap_latency.py --accel "$accel" --qemu "$(command -v qemu-system-x86_64)" \
            --kernel "$RUNNER_TEMP"/linux/boot/vmlinuz-* --modules "$RUNNER_TEMP/linux/usr/lib/modules" \
            --control measurements/local/swap-control/host/build/vram-host --result measurements/local/swap-raw.json
          node automation/swap-latency.mjs measurements/local/swap-raw.json measurements/local/swap-latency.json
      - name: Calibrate the optimizer and check every restored page
        run: node automation/operate.mjs "$PROFILE" "$CEILING" "$BUDGET" measurements/local/receipt.json
      - name: Check out the 0.5.9 guest benchmark control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: b0d40626a23f69793a04d30c72a38af007a6e08b
          path: measurements/local/control
      - name: Build the control on the same distribution
        run: |
          make -C measurements/local/control/host LDFLAGS=-static
          python3 measurements/local/control/host/package.py "$RUNNER_TEMP/control.deb"
      - name: Package Linux host software and receipt
        run: |
          mkdir -p dist
          cp host/build/vram-host measurements/local/receipt.json measurements/local/linux-host.json dist/
          python3 host/package.py dist/
          dpkg-deb -x dist/vram-host_*.deb "$RUNNER_TEMP/installed"
          mkdir "$RUNNER_TEMP/reserve-a" "$RUNNER_TEMP/reserve-b"
          sudo mount -t tmpfs -o size=64m,mode=1777 tmpfs "$RUNNER_TEMP/reserve-a"
          trap 'sudo umount "$RUNNER_TEMP/reserve-a"' EXIT
          (ulimit -f 614400
           "$RUNNER_TEMP/installed/usr/bin/vram-machine" qualify --platform-max-mib 1024 --guest-max-mib 2048 --min-read-mib-s 1 --min-write-mib-s 1 \
             --backing-dir "$RUNNER_TEMP/reserve-a" --backing-dir "$RUNNER_TEMP/reserve-b" > dist/full-capacity.json)
          python3 -c 'import json; r=json.load(open("dist/full-capacity.json")); assert r["verified_bytes"] == 2**30 and len(r["reserved"]) == 2 and sum(e["files"] for e in r["reserved"]) == 3 and r["verdict"] == "complete"'
          node automation/qualification.mjs dist/full-capacity.json
          python3 automation/test-qualification.py
          python3 host/tests/parallel_store.py --control measurements/local/control --result dist/parallel-store.json
          python3 host/tests/file_scale.py --result dist/file-backed-independent.json
          python3 host/tests/file_scale.py --control measurements/local/control --result dist/file-range.json
          sudo modprobe fuse
          sudo python3 host/tests/dimm.py --native --qemu "$(command -v qemu-system-x86_64)" \
            --kernel "$RUNNER_TEMP"/linux/boot/vmlinuz-* --package dist/vram-host_*.deb --result dist/linux-dimm.json
          node automation/projection.mjs dist/linux-dimm.json dist/projection-routes.json
          sudo python3 host/tests/parallel.py --qemu "$(command -v qemu-system-x86_64)" \
            --kernel "$RUNNER_TEMP"/linux/boot/vmlinuz-* --package dist/vram-host_*.deb --baseline-package "$RUNNER_TEMP/control.deb" --result dist/parallel-guest.json
          node automation/performance.mjs dist/parallel-guest.json dist/performance-frontier.json
          cp measurements/local/managed-*.json measurements/local/swap-latency.json dist/
          cp README.md dist/
          (cd dist && sha256sum vram-host *.deb *.json README.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vram-linux-x86_64
          path: dist/
      - name: Assemble the product site from the verified model and tested package
        run: |
          python3 automation/product_site.py --package dist/vram-host_*.deb --out product-public
          cp dist/swap-latency.json product-public/downloads/
          cmp dist/vram-host_*.deb product-public/downloads/vram-host_*.deb
          (cd product-public/downloads && sha256sum -c SHA256SUMS)
          python3 -m http.server 8765 --bind 127.0.0.1 --directory product-public > "$RUNNER_TEMP/product-http.log" 2>&1 &
          trap 'kill $!' EXIT
          node automation/test-product-site.mjs http://127.0.0.1:8765/
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: product-public
  pages:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: vram-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
